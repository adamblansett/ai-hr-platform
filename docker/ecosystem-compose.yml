version: "3.9"

networks:
  recruiter_hr_bridge:
    name: recruiter_hr_bridge
    driver: bridge

services:
  # Shared Data Layer
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ecosystem_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_hr_db
    ports:
      - "5432:5432"
    networks:
      - recruiter_hr_bridge
    volumes:
      - ecosystem_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecosystem_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - recruiter_hr_bridge

  # ai-hr-platform backend
  hr_backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ecosystem_hr_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_hr_db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      SECRET_KEY: ecosystem-shared-secret-key-32chars!
      RECRUITER_WEBHOOK_SECRET: dev-shared-recruiter-webhook-secret-key
    networks:
      - recruiter_hr_bridge
    depends_on:
      - postgres
      - redis

  # Mock ai-recruiter service bridging recruitment offer events
  recruiter_mock:
    image: python:3.12-slim
    container_name: ecosystem_recruiter_mock
    command: python -m http.server 9000
    ports:
      - "9000:9000"
    networks:
      - recruiter_hr_bridge

volumes:
  ecosystem_pgdata:
