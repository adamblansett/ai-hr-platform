apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  RECRUITER_WEBHOOK_SECRET: {{ .Values.secrets.recruiterWebhookSecret | quote }}
  FALLBACK_OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
